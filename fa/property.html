<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جزئیات ملک — دریم‌ول</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{accent:'#19CF79',heading:'#152046',body:'#636363',muted:'#F5F7FA'}}}}</script>
<style>body{font-family:'Vazirmatn',sans-serif;background:#F5F7FA;color:#636363}h1,h2,h3{font-family:'Vazirmatn',sans-serif;color:#152046}</style>
</head>
<body class="bg-[#F5F7FA]">
<header class="sticky top-0 z-40 bg-white shadow">
  <div class="max-w-[1620px] mx-auto px-4 lg:px-6 h-[86px] flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2"><span class="h-9 w-9 rounded-lg bg-accent grid place-items-center text-white"><i class="fa-solid fa-house"></i></span><span class="font-bold text-heading">دریم‌ول</span></a>
    <a href="properties.html" class="text-sm hover:text-accent">← بازگشت به املاک</a>
  </div>
</header>
<div class="max-w-[1620px] mx-auto px-4 lg:px-6 py-8">
  <div class="flex items-center gap-2 text-sm mb-6"><a href="index.html">خانه</a><span>/</span><a href="properties.html">املاک</a><span>/</span><span class="text-heading font-medium">جزئیات</span></div>
  <div id="content"></div>
</div>
<footer class="mt-16 bg-[#0D0D0D] text-zinc-400"><div class="max-w-[1620px] mx-auto px-4 lg:px-6 py-8 text-center text-xs border-t border-white/10">© ۲۰۲۴ دریم‌ول</div></footer>
<script src="../assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const id=new URLSearchParams(location.search).get('id');
  const p=getProperties().find(x=>x.id===id);
  const el=document.getElementById('content');
  if(!p){ el.innerHTML=`<div class="text-center py-16 bg-white rounded-2xl">یافت نشد — <a href="properties.html" class="text-accent">بازگشت</a></div>`; return; }
  const gallery=p.gallery||[p.image];
  const garage=p.garages||p.garage||'—';
  el.innerHTML=`
    <div class="grid lg:grid-cols-3 gap-8">
      <div class="lg:col-span-2">
        <div class="bg-white rounded-[20px] p-3 shadow"><div class="h-[420px] rounded-[15px] overflow-hidden"><img id="mainImg" src="${p.image}" class="h-full w-full object-cover"></div><div class="grid grid-cols-4 gap-3 mt-3">${gallery.slice(0,4).map(g=>`<img src="${g}" class="h-24 rounded-xl object-cover cursor-pointer" onclick="document.getElementById('mainImg').src='${g}'">`).join('')}</div></div>
        <div class="bg-white rounded-[20px] p-6 mt-6 shadow">
          <h1 class="text-2xl font-bold">${p.title}</h1><p class="text-sm mt-2"><i class="fa-solid fa-location-dot text-accent"></i> ${p.location} • ${p.type} • ${p.status==='For Rent'?'اجاره':'فروش'}</p>
          <p class="mt-4 text-sm leading-7">${p.description}</p>
          <div class="flex flex-wrap gap-2 mt-6 text-sm"><span class="px-4 py-2 rounded-full bg-accent text-white">${p.beds} خواب</span><span class="px-4 py-2 rounded-full bg-white border">${p.baths} حمام</span><span class="px-4 py-2 rounded-full bg-white border">${p.sqft} متر</span><span class="px-4 py-2 rounded-full bg-white border">${typeof garage==='number'?garage+' گاراژ':garage}</span></div>
          ${p.panorama?`<div class="mt-8 bg-[#F5F7FA] rounded-2xl p-6 border"><h3 class="font-semibold">تور مجازی ۳۶۰ درجه</h3><button id="tourBtn" class="mt-4 px-6 py-2.5 rounded-lg bg-accent text-white text-sm">شروع تور</button><div id="panorama" class="hidden mt-4 h-[380px] rounded-2xl overflow-hidden border bg-black"></div></div>`:''}
          ${p.video?`<div class="mt-6 bg-white rounded-2xl border p-6"><h3 class="font-semibold">ویدئو معرفی</h3><video controls preload="none" poster="${p.image}" class="mt-3 w-full rounded-xl"><source src="${p.video}" type="video/mp4"></video></div>`:''}
          ${p.podcast?`<div class="mt-6 bg-white rounded-2xl border p-6"><h3 class="font-semibold">پادکست</h3><audio controls class="mt-3 w-full"><source src="${p.podcast}" type="audio/mpeg"></audio></div>`:''}
        </div>
      </div>
      <div class="bg-white rounded-[20px] p-6 h-fit sticky top-[100px] shadow">
        <div class="text-2xl font-bold text-heading">${p.priceLabel}</div>
        <div class="mt-4 space-y-2 text-sm"><div class="flex justify-between"><span>نوع</span><span class="font-medium text-heading">${p.type}</span></div><div class="flex justify-between"><span>وضعیت</span><span class="font-medium text-heading">${p.status==='For Rent'?'اجاره':'فروش'}</span></div><div class="flex justify-between"><span>شهر</span><span class="font-medium text-heading">${p.city}</span></div></div>
        <button onclick="alert('با مشاور تماس گرفته شد')" class="w-full mt-6 py-3 rounded-xl bg-accent text-white font-medium">تماس با مشاور</button>
      </div>
    </div>`;
  if(p.panorama){
    const btn=document.getElementById('tourBtn'); const pano=document.getElementById('panorama');
    btn.addEventListener('click',()=>{ btn.textContent='در حال لود...'; pano.classList.remove('hidden'); pannellum.viewer('panorama',{type:'equirectangular',panorama:p.panorama,autoLoad:true}); btn.style.display='none';});
  }
});
</script>
</body>
</html>
