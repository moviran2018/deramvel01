<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>املاک — دریم‌ول</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{accent:'#19CF79',heading:'#152046',body:'#636363',muted:'#F5F7FA'},fontFamily:{heading:['Vazirmatn','sans-serif'],body:['Vazirmatn','sans-serif']}}}}</script>
<style>body{font-family:'Vazirmatn',sans-serif;background:#F5F7FA;color:#636363}h1,h2,h3{font-family:'Vazirmatn',sans-serif;color:#152046}</style>
</head>
<body class="bg-[#F5F7FA]">
<header class="sticky top-0 z-40 bg-white shadow-[0_4px_20px_rgba(21,32,70,.07)]">
  <div class="max-w-[1620px] mx-auto px-4 lg:px-6 h-[86px] flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2"><span class="h-9 w-9 rounded-lg bg-accent grid place-items-center text-white"><i class="fa-solid fa-house"></i></span><span class="font-bold text-[22px] text-heading">دریم‌ول</span></a>
    <nav class="hidden xl:flex items-center gap-6 text-sm font-medium text-heading"><a href="index.html">خانه</a><a href="properties.html" class="text-accent">املاک</a><a href="../index.html">EN</a></nav>
    <a href="index.html" class="text-sm border px-4 py-2 rounded-full">← خانه</a>
  </div>
</header>
<div class="max-w-[1620px] mx-auto px-4 lg:px-6 py-8">
  <div class="flex items-center gap-2 text-sm"><a href="index.html" class="hover:text-accent">خانه</a><span>/</span><span class="text-heading font-medium">لیست املاک</span></div>
  <div class="flex flex-col lg:flex-row gap-6 mt-6">
    <aside class="lg:w-[340px] shrink-0">
      <div class="bg-white rounded-[15px] p-6 shadow sticky top-[100px]">
        <div class="flex items-center justify-between"><h3 class="font-semibold text-heading">خانه‌ات را پیدا کن</h3><button onclick="resetFilters()" class="text-xs text-accent font-medium">حذف فیلتر</button></div>
        <div class="mt-5 space-y-4">
          <div><label class="text-xs font-semibold text-heading">موقعیت</label><select id="fLoc" class="mt-1 w-full rounded-xl border px-3 py-2.5 text-sm bg-white"><option value="">همه</option></select></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="text-xs font-semibold">نوع</label><select id="fType" class="mt-1 w-full rounded-xl border px-3 py-2.5 text-sm"><option value="">همه</option><option>House</option><option>Apartment</option><option>Villa</option><option>Townhouse</option></select></div>
            <div><label class="text-xs font-semibold">وضعیت</label><select id="fStatus" class="mt-1 w-full rounded-xl border px-3 py-2.5 text-sm"><option value="">همه</option><option>For Rent</option><option>For Sale</option></select></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="text-xs font-semibold">خواب</label><select id="fBeds" class="mt-1 w-full rounded-xl border px-3 py-2.5 text-sm"><option value="">هر تعداد</option><option>1</option><option>2</option><option>3</option></select></div>
            <div><label class="text-xs font-semibold">حمام</label><select id="fBaths" class="mt-1 w-full rounded-xl border px-3 py-2.5 text-sm"><option value="">هر تعداد</option><option>1</option><option>2</option><option>3</option></select></div>
          </div>
          <div><label class="text-xs font-semibold">جستجو</label><input id="fSearch" placeholder="عنوان یا شهر..." class="mt-1 w-full rounded-xl border px-3 py-2.5 text-sm"></div>
          <div><label class="text-xs font-semibold">حداکثر قیمت: <span id="priceLabel" class="text-accent">۱M+</span></label><input id="fPrice" type="range" min="0" max="1000000" step="5000" value="1000000" class="w-full mt-2 accent-accent"></div>
        </div>
      </div>
    </aside>
    <div class="flex-1">
      <div class="bg-white rounded-xl px-4 py-3 flex items-center justify-between shadow-sm">
        <p id="count" class="text-sm">نمایش ۰ نتیجه</p>
        <select id="sort" class="rounded-full border px-4 py-2 text-sm"><option value="default">پیش‌فرض</option><option value="low">ارزان‌ترین</option><option value="high">گران‌ترین</option></select>
      </div>
      <div id="grid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-6 mt-6"></div>
      <div id="pagination" class="flex items-center justify-center gap-2 mt-8"></div>
    </div>
  </div>
</div>
<footer class="mt-16 bg-[#0D0D0D] text-zinc-400"><div class="max-w-[1620px] mx-auto px-4 lg:px-6 py-8 text-center text-xs border-t border-white/10">© ۲۰۲۴ دریم‌ول</div></footer>
<script src="../assets/app.js"></script>
<script>
const els={loc:document.getElementById('fLoc'),type:document.getElementById('fType'),status:document.getElementById('fStatus'),beds:document.getElementById('fBeds'),baths:document.getElementById('fBaths'),search:document.getElementById('fSearch'),price:document.getElementById('fPrice'),priceLabel:document.getElementById('priceLabel'),sort:document.getElementById('sort'),grid:document.getElementById('grid'),count:document.getElementById('count')};
let currentPage=1; const perPage=9;
function init(){
  const cities=[...new Set(getProperties().map(p=>p.city))];
  cities.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;els.loc.appendChild(o)});
  ['input','change'].forEach(e=>{els.loc.addEventListener(e,()=>{currentPage=1;render()});els.type.addEventListener(e,()=>{currentPage=1;render()});els.status.addEventListener(e,()=>{currentPage=1;render()});els.beds.addEventListener(e,()=>{currentPage=1;render()});els.baths.addEventListener(e,()=>{currentPage=1;render()});els.search.addEventListener(e,()=>{currentPage=1;render()});els.sort.addEventListener(e,()=>{currentPage=1;render()});});
  els.price.addEventListener('input',()=>{els.priceLabel.textContent=els.price.value==1000000?'۱M+':'$'+Number(els.price.value).toLocaleString();currentPage=1;render()});
  render();
}
function getFiltered(){
  let list=getProperties().filter(p=>{
    if(els.loc.value && p.city!==els.loc.value) return false;
    if(els.type.value && p.type!==els.type.value) return false;
    if(els.status.value && p.status!==els.status.value) return false;
    if(els.beds.value && String(p.beds)!==els.beds.value) return false;
    if(els.baths.value && String(p.baths)!==els.baths.value) return false;
    if(p.price>Number(els.price.value)) return false;
    if(els.search.value && !(`${p.title} ${p.city}`.toLowerCase().includes(els.search.value.toLowerCase()))) return false;
    return true;
  });
  if(els.sort.value==='low') list=[...list].sort((a,b)=>a.price-b.price);
  if(els.sort.value==='high') list=[...list].sort((a,b)=>b.price-a.price);
  return list;
}
function render(){
  const list=getFiltered();
  const totalPages=Math.ceil(list.length/perPage)||1;
  if(currentPage>totalPages) currentPage=totalPages;
  const paged=list.slice((currentPage-1)*perPage,currentPage*perPage);
  els.count.textContent=`نمایش ${paged.length} از ${list.length} نتیجه`;
  els.grid.innerHTML=paged.length?paged.map(p=>{
    const garage=p.garages||p.garage||'no garage';
    return `<a href="../property.html?id=${p.id}" class="group bg-white rounded-[15px] overflow-hidden border hover:shadow-xl transition flex flex-col"><div class="relative h-52 overflow-hidden rounded-[15px] m-2 mb-0"><img src="${p.image}" class="h-full w-full object-cover group-hover:scale-105 transition duration-500"><span class="absolute top-3 right-3 text-xs px-3 py-1 rounded-full font-medium ${p.status==='For Rent'?'bg-accent text-white':'bg-amber-500 text-white'}">${p.status==='For Rent'?'اجاره':'فروش'}</span></div><div class="p-5"><h3 class="font-semibold text-heading line-clamp-1">${p.title}</h3><p class="text-xs mt-1">${p.location}</p><div class="flex gap-2 mt-3 text-xs"><span>${p.beds} خواب</span><span>${p.baths} حمام</span><span>${p.sqft} متر</span></div><div class="mt-4 font-bold text-heading">${p.priceLabel}</div></div></a>`;
  }).join(''):`<div class="col-span-full text-center py-16">نتیجه‌ای یافت نشد</div>`;
  let html=''; for(let i=1;i<=totalPages;i++) html+=`<button onclick="goPage(${i})" class="h-9 w-9 rounded-xl grid place-items-center text-sm font-medium ${i===currentPage?'bg-accent text-white':'bg-white border'}">${i}</button>`; document.getElementById('pagination').innerHTML=html;
}
function goPage(n){currentPage=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function resetFilters(){els.loc.value='';els.type.value='';els.status.value='';els.beds.value='';els.baths.value='';els.search.value='';els.price.value=1000000;els.priceLabel.textContent='۱M+';els.sort.value='default';currentPage=1;render();}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
